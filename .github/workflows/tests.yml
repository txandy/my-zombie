name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  gdunit4:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Read Godot version
        id: godot
        run: echo "version=$(cat .godot-version)" >> "$GITHUB_OUTPUT"

      - name: Cache Godot
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ steps.godot.outputs.version }}-linux-x86_64

      - name: Download Godot
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          v="${{ steps.godot.outputs.version }}"
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${v}/Godot_v${v}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${v}_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot

      - name: Run tests
        env:
          GODOT_BIN: /home/runner/godot/godot
        run: bash tools/run_tests.sh

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gdunit4-report
          path: reports/
          if-no-files-found: ignore

      - name: Coop soak (host + client processes, one accelerated day)
        env:
          GODOT_BIN: /home/runner/godot/godot
        run: |
          "$GODOT_BIN" --headless --path . --import > /dev/null 2>&1 || true
          timeout 600 "$GODOT_BIN" --headless --path . res://tools/coop_soak.tscn -- --seed=12345 2>&1 | grep -E "COOP|SCRIPT ERROR"
          exit ${PIPESTATUS[0]}
